$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: prep_data
display_name: prep_data
description: Validate, label-encode and split the used-car data into train and test sets.
inputs:
  raw_data:
    type: uri_file
  test_train_ratio:
    type: number
    default: 0.2
outputs:
  train_data:
    type: uri_folder
  test_data:
    type: uri_folder
code: ../../../data-science/src
command: >-
  python prep.py
  --raw_data ${{inputs.raw_data}}
  --test_train_ratio ${{inputs.test_train_ratio}}
  --train_data ${{outputs.train_data}}
  --test_data ${{outputs.test_data}}
environment: azureml:used-cars-train-env@latest
